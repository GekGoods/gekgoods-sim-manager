name: Build and publish signed GekGoods release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare signing files
        env:
          SIGNING_CONFIG_B64: ${{ secrets.GEKGOODS_SIGNING_CONFIG }}
          KEYSTORE_B64: ${{ secrets.GEKGOODS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_CONFIG_B64" || { echo 'Missing GEKGOODS_SIGNING_CONFIG secret'; exit 1; }
          test -n "$KEYSTORE_B64" || { echo 'Missing GEKGOODS_KEYSTORE_BASE64 secret'; exit 1; }
          printf '%s' "$SIGNING_CONFIG_B64" | base64 --decode > keystore.properties
          printf '%s' "$KEYSTORE_B64" | base64 --decode > release-keystore
          python3 - <<'PY'
          from pathlib import Path
          import re

          props = Path("keystore.properties")
          content = props.read_text()
          replacement = f"storeFile={Path('release-keystore').resolve()}"
          content, count = re.subn(r"(?m)^\s*storeFile\s*=.*$", replacement, content)
          if count > 1:
              raise SystemExit("Signing config has more than one storeFile property")
          if count == 0:
              content = content.rstrip() + "\n" + replacement + "\n"
          props.write_text(content)
          PY

      - name: Build signed app
        run: >-
          ./gradlew --no-daemon
          :app-unpriv:assembleRelease
          :app-unpriv:bundleRelease

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app-unpriv/build/outputs/apk/release/*.apk release-assets/gekgoods-sim-manager.apk
          cp app-unpriv/build/outputs/bundle/release/*.aab release-assets/gekgoods-sim-manager.aab

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --title "GekGoods SIM Manager $GITHUB_REF_NAME"
          --generate-notes
